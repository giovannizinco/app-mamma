<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#23716C">
<meta name="theme-color" content="#173634" media="(prefers-color-scheme: dark)">
<title>Forza Mamma❤️</title>
<style>
@font-face{font-family:"Atkinson Hyperlegible";font-weight:400;font-style:normal;font-display:swap;src:url(fonts/atkinson-hyperlegible-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-weight:400;font-style:italic;font-display:swap;src:url(fonts/atkinson-hyperlegible-latin-400-italic.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-weight:700;font-style:normal;font-display:swap;src:url(fonts/atkinson-hyperlegible-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Literata";font-weight:500;font-display:swap;src:url(fonts/literata-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Literata";font-weight:600;font-display:swap;src:url(fonts/literata-latin-600-normal.woff2) format("woff2")}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
/* Layout: app a una colonna, pensata per una mano sola — barra d'allarme in alto, navigazione grande in basso */
:root{
  --bg:#EEF3F2; --surface:#FFFFFF; --sunk:#E2EAE8; --ink:#17282B; --muted:#56696B; --line:#CBD8D6;
  --accent:#23716C; --accent-ink:#FFFFFF; --accent-soft:#D3E8E5;
  --warm:#B86A12; --warm-soft:#F6E6CF;
  --alarm:#B3261E; --alarm-soft:#F9DEDA; --ok:#2E7D4F;
  --bar:#23716C; --bar-ink:#FFFFFF;
  --rose:#A23B5B; --rose-soft:#F6DEE6; --sky:#3F5FA8; --sky-soft:#DFE6F6; --leaf:#2E7D4F; --leaf-soft:#DDEFE3;
  --f-display:"Literata", Georgia, "Times New Roman", serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1A1C; --surface:#172527; --sunk:#1F3033; --ink:#E4EEEC; --muted:#9DB2B0; --line:#2C4245;
  --accent:#5FBDB3; --accent-ink:#0B1A1A; --accent-soft:#1D3D3B;
  --warm:#E7A85A; --warm-soft:#3A2C18; --alarm:#FF8A7E; --alarm-soft:#3D1D1A; --ok:#7FCB9A;
  --bar:#173634; --bar-ink:#E4EEEC; --rose:#F08DAE; --rose-soft:#3B1E28; --sky:#9DB4F0; --sky-soft:#1E2840; --leaf:#7FCB9A; --leaf-soft:#1A3324; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1A1C; --surface:#172527; --sunk:#1F3033; --ink:#E4EEEC; --muted:#9DB2B0; --line:#2C4245;
  --accent:#5FBDB3; --accent-ink:#0B1A1A; --accent-soft:#1D3D3B;
  --warm:#E7A85A; --warm-soft:#3A2C18; --alarm:#FF8A7E; --alarm-soft:#3D1D1A; --ok:#7FCB9A;
  --bar:#173634; --bar-ink:#E4EEEC; --rose:#F08DAE; --rose-soft:#3B1E28; --sky:#9DB4F0; --sky-soft:#1E2840; --leaf:#7FCB9A; --leaf-soft:#1A3324; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;
  --gl:max(16px,env(safe-area-inset-left,0px));--gr:max(16px,env(safe-area-inset-right,0px));
  padding-left:var(--gl);padding-right:var(--gr);
  padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-block:12px 24px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:1.75rem} h2{font-size:1.3rem} h3{font-size:1.08rem}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.eyebrow{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* barra in alto: menu, titolo della sezione, pulsante urgenze */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;margin:0 calc(-1 * var(--gr)) 0 calc(-1 * var(--gl));
  padding:0 var(--gr) 0 var(--gl);background:var(--bar);color:var(--bar-ink);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.appbar .in{max-width:620px;margin:0 auto;min-height:60px;display:flex;align-items:center;gap:6px}
.appbar .title{flex:1;min-width:0;font-family:var(--f-display);font-weight:600;font-size:1.25rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:48px;height:48px;margin-left:-8px;border:0;border-radius:12px;background:transparent;color:inherit;display:grid;place-items:center;cursor:pointer;flex:none}
.sos{display:flex;align-items:center;gap:6px;background:var(--alarm-soft);color:var(--alarm);border:1.5px solid var(--alarm);border-radius:999px;
  padding:0 14px;min-height:44px;font-weight:700;font-size:.95rem;cursor:pointer;flex:none}
.sos svg{flex:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:26;background:var(--bar)}

/* menu laterale */
.drawer-bg{position:fixed;inset:0;z-index:45;background:rgba(10,20,22,.5);opacity:0;pointer-events:none;transition:opacity .2s}
.drawer-bg.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;z-index:46;width:min(84vw,320px);background:var(--surface);border-radius:0 20px 20px 0;
  display:flex;flex-direction:column;overflow-y:auto;transform:translateX(-102%);visibility:hidden;transition:transform .25s ease,visibility 0s .25s;
  padding:calc(24px + env(safe-area-inset-top,0px)) 12px calc(16px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.drawer.open{transform:none;visibility:visible;transition:transform .25s ease}
.dr-head{display:flex;align-items:center;gap:14px;padding:0 8px 20px;border-bottom:1px solid var(--line);margin-bottom:10px}
.dr-logo{width:56px;height:56px;border-radius:16px;border:2px solid var(--accent);background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.dr-head b{display:block;font-family:var(--f-display);font-size:1.25rem;line-height:1.2}
.dr-item{display:flex;align-items:center;gap:18px;width:100%;min-height:56px;padding:0 14px;border:0;border-radius:12px;background:transparent;text-align:left;font-size:1.05rem;cursor:pointer}
.dr-item svg{width:24px;height:24px;flex:none;color:var(--accent)}
.dr-item.on{background:var(--accent-soft);font-weight:700}
.dr-item.alarm,.dr-item.alarm svg{color:var(--alarm)}
.dr-foot{margin-top:auto;padding-top:10px;border-top:1px solid var(--line)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px}
.plain{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}

.btn{min-height:52px;padding:0 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.soft{background:var(--accent-soft);border-color:transparent}
.btn.ghost{background:transparent}
.btn.sm{min-height:44px;padding:0 14px;font-size:.95rem}
.btn:disabled{opacity:.5}

/* checklist */
.check{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:12px;background:var(--sunk);cursor:pointer;min-height:60px;border:1.5px solid transparent;width:100%;text-align:left}
.check .box{width:30px;height:30px;border-radius:9px;border:2px solid var(--muted);flex:none;display:grid;place-items:center}
.check.on{background:var(--accent-soft);border-color:var(--accent)}
.check.on .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.check .lab{flex:1;min-width:0}
.check .sub{display:block;font-size:.88rem;color:var(--muted)}

.counter{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:12px;background:var(--sunk);min-height:64px}
.counter .lab{flex:1;min-width:0}
.counter .n{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.3rem;min-width:3.2ch;text-align:center}
.round{width:48px;height:48px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-size:1.5rem;font-weight:700;cursor:pointer;display:grid;place-items:center;flex:none}
.round.plus{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.drops{display:flex;gap:5px;margin-top:4px}
.drops i{width:14px;height:18px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:var(--line);display:block}
.drops i.on{background:var(--accent)}

.hero{display:flex;flex-direction:column;gap:6px}
.chemo-chip{display:inline-flex;align-items:center;gap:8px;background:var(--warm-soft);color:var(--warm);border-radius:999px;padding:6px 14px;font-weight:700;font-size:.95rem;align-self:flex-start}

/* form */
label.f{display:flex;flex-direction:column;gap:6px;font-weight:700}
input[type=text],input[type=tel],input[type=date],input[type=time],input[type=number],textarea,select{
  font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;min-height:50px;padding:10px 12px;width:100%}
textarea{min-height:90px;resize:vertical}
.scale{display:flex;flex-direction:column;gap:6px}
.scale .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.scale output{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.15rem;min-width:2ch;text-align:right}
input[type=range]{width:100%;height:40px;accent-color:var(--accent)}
.ends{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{min-height:44px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;font-size:.95rem}
.pill.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.alert{border-radius:12px;padding:14px;background:var(--alarm-soft);color:var(--alarm);border:1.5px solid var(--alarm);display:flex;flex-direction:column;gap:6px;font-weight:700}
.alert p{font-weight:400;color:var(--ink)}
.note{border-radius:12px;padding:12px 14px;background:var(--warm-soft);color:var(--ink);font-size:.95rem}

/* respirazione */
.breath{display:grid;place-items:center;height:290px;position:relative}
.orb{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 40% 35%,var(--accent-soft),var(--accent));transition:transform 4s ease-in-out;transform:scale(1)}
.breath .ring{position:absolute;width:260px;height:260px;border-radius:50%;border:2px dashed var(--line)}
.breath .cue{position:absolute;bottom:4px;font-family:var(--f-display);font-size:1.5rem;font-weight:600}
.seg{display:flex;background:var(--sunk);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;min-height:46px;border:0;border-radius:9px;background:transparent;font-weight:700;cursor:pointer;font-size:.95rem}
.seg button.on{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.big-time{font-family:var(--f-display);font-size:2.6rem;font-variant-numeric:tabular-nums;text-align:center}

/* liste */
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--sunk)}
.li .grow{overflow-wrap:anywhere}
.x{width:44px;height:44px;border-radius:10px;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:1.3rem;flex:none}
.tel{font-variant-numeric:tabular-nums;font-weight:700;user-select:all}
.date-badge{font-variant-numeric:tabular-nums;font-weight:700;background:var(--warm-soft);color:var(--warm);border-radius:8px;padding:4px 8px;font-size:.9rem;white-space:nowrap}

/* storico */
.hist{display:flex;flex-direction:column;gap:6px}
.hrow{display:grid;grid-template-columns:5.2em 1fr auto;gap:10px;align-items:center;font-size:.92rem}
.bars{display:flex;gap:3px;align-items:flex-end;height:26px}
.bars span{width:10px;border-radius:3px 3px 0 0;background:var(--accent)}
.spark{width:100%;height:90px;display:block}

/* guide */
details.g{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.g summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:56px;font-family:var(--f-display);font-weight:600;font-size:1.06rem}
details.g summary::-webkit-details-marker{display:none}
details.g summary::after{content:"+";font-family:var(--f-body);font-size:1.4rem;color:var(--muted)}
details.g[open] summary::after{content:"–"}
details.g .body{padding:0 18px 18px;display:flex;flex-direction:column;gap:10px}
details.g ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.src{font-size:.85rem;color:var(--muted)}

/* calendario a giorni */
.cal-m{font-family:var(--f-display);font-weight:600;font-size:1.05rem;padding:14px 0 6px}
.cal-m::first-letter{text-transform:uppercase}
.cal-day{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.cal-date{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:12px;padding:6px 0;line-height:1.15;color:var(--accent)}
.cal-date span{font-size:.8rem;font-weight:700;color:var(--muted)}
.cal-date b{font-size:1.5rem;font-variant-numeric:tabular-nums}
.cal-day.today .cal-date{background:var(--accent);color:var(--accent-ink)}
.cal-day.today .cal-date span{color:inherit}
.cal-evs{display:flex;flex-direction:column;gap:8px;min-width:0}
.cal-ev{display:flex;align-items:center;gap:4px;min-height:60px;padding:8px 2px 8px 14px;border-radius:12px;background:var(--ev-bg);border-left:5px solid var(--ev)}
.cal-ev .grow{overflow-wrap:anywhere}
.cal-ev b{display:block}
.cal-empty{padding:12px 14px;border:1.5px dashed var(--line);border-radius:12px;color:var(--muted)}
.cal.past{opacity:.65}
.ev-chemio{--ev:var(--warm);--ev-bg:var(--warm-soft)}
.ev-sangue{--ev:var(--rose);--ev-bg:var(--rose-soft)}
.ev-visita{--ev:var(--accent);--ev-bg:var(--accent-soft)}
.ev-tac{--ev:var(--sky);--ev-bg:var(--sky-soft)}
.ev-fisio{--ev:var(--leaf);--ev-bg:var(--leaf-soft)}
.ev-altro{--ev:var(--muted);--ev-bg:var(--sunk)}

.sheet-bg{position:fixed;inset:0;background:rgba(10,20,22,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:620px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;
  padding:20px max(18px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(28px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;z-index:50;font-size:.95rem}
.sync{font-size:.8rem;color:var(--muted)}
/* cucina */
.rc{display:flex;flex-direction:column;gap:4px;padding:14px;border-radius:12px;background:var(--sunk);border:0;width:100%;text-align:left;cursor:pointer;min-height:64px}
.rc b{font-size:1.04rem}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.8rem;font-weight:700;border-radius:999px;padding:2px 10px;background:var(--accent-soft);color:var(--ink)}
.tag.w{background:var(--warm-soft)}
.ingr{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.steps{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:8px}
.vid{display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none}
.step-big{font-size:1.35rem;line-height:1.45;min-height:7em;background:var(--sunk);border-radius:12px;padding:18px}
/* chiamate */
a.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:inherit}
a.btn.primary{color:var(--accent-ink)}
.btn.alarm{background:var(--alarm);border-color:var(--alarm);color:#fff}
.calls{display:flex;flex-direction:column;gap:6px;flex:none}
@media (prefers-reduced-motion: reduce){.orb,.drawer,.drawer-bg{transition:none}}
#impost{scroll-margin-top:84px}
</style>
</head>
<body>


<header class="appbar">
  <div class="in">
    <button class="icon-btn" id="menuBtn" type="button" aria-label="Apri il menu" aria-expanded="false" aria-controls="drawer">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <span class="title" id="barTitle">Oggi</span>
    <button class="sos" id="sosBtn" type="button" aria-haspopup="dialog" aria-label="Quando chiamare subito il medico">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 3 2.5 20h19L12 3Z"/><path d="M12 10v4.5M12 17.5v.01"/></svg><span>Urgenze</span>
    </button>
  </div>
</header>

<div class="wrap" id="app">
  <main id="view"></main>
</div>

<div class="drawer-bg" id="drawerBg"></div>
<aside class="drawer" id="drawer" aria-label="Menu">
  <div class="dr-head">
    <span class="dr-logo"><svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.3 3 4.5 6.7 4.5c2.1 0 3.6 1.1 4.3 2.4h2c.7-1.3 2.2-2.4 4.3-2.4 3.7 0 5.8 3.8 4.3 7.2C19.5 16.4 12 21 12 21Z"/></svg></span>
    <div class="grow"><b>Forza Mamma</b><span class="small muted" id="drNome"></span></div>
  </div>
  <nav aria-label="Sezioni">
    <button class="dr-item" data-tab="oggi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Oggi</button>
    <button class="dr-item" data-tab="respira"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 8h11a3 3 0 1 0-3-3M3 12h15a3 3 0 1 1-3 3M3 16h7"/></svg>Respiro e movimento</button>
    <button class="dr-item" data-tab="diario"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 3h11l3 3v15H5z"/><path d="M9 9h6M9 13h6M9 17h3"/></svg>Diario</button>
    <button class="dr-item" data-tab="cure"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Cure e calendario</button>
    <button class="dr-item" data-tab="cucina"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 11h16a8 8 0 0 1-16 0Z"/><path d="M9 7c0-1.5 1-1.5 1-3M14 7c0-1.5 1-1.5 1-3M2.5 11h19"/></svg>Cucina</button>
    <button class="dr-item" data-tab="guide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/></svg>Guide pratiche</button>
  </nav>
  <div class="dr-foot">

  </div>

<script>
(()=>{
/* ---------- dati e salvataggio ---------- */
const LS="respiro-v1";
const DEF_PROFILO={nome:"Anna Maria",cicli:[],farmaci:[],contatti:[
  {ruolo:"Centro oncologico / day hospital",nome:"",tel:""},
  {ruolo:"Oncologo di riferimento",nome:"",tel:""},
  {ruolo:"Medico di famiglia",nome:"",tel:""},
  {ruolo:"Fisioterapista / ortopedico (spalla)",nome:"",tel:""}],
  esSpalla:[],obAcqua:6,obPasti:5,obCammino:15,
  prom:{farmaci:true,acqua:true,cure:true,respiro0:"10:30",respiro1:"17:30",cammino:"11:00",diario:"20:30"}};
let S={profilo:structuredClone(DEF_PROFILO),giorni:{},domande:[]};
let db=null, online=false;
try{const raw=localStorage.getItem(LS); if(raw){const o=JSON.parse(raw); S={...S,...o,profilo:{...DEF_PROFILO,...(o.profilo||{}),prom:{...DEF_PROFILO.prom,...(o.profilo?.prom||{})}}}}}catch(e){}
if(!S.profilo.nome) S.profilo.nome=DEF_PROFILO.nome;
const saveLocal=()=>{try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}};

const pend={}, busy={};
function queue(path,body){ // un salvataggio alla volta per documento, raggruppato
  saveLocal(); if(!db) return;
  pend[path]=body; clearTimeout(pend["_t"+path]);
  pend["_t"+path]=setTimeout(()=>flush(path),600);
}
async function flush(path){
  if(busy[path]||!(path in pend)) return;
  const body=pend[path]; delete pend[path]; busy[path]=true;
  try{await db.doc(path).set(JSON.parse(JSON.stringify(body)))}catch(e){toast("Non sono riuscito a salvare online: resta salvato su questo telefono")}
  busy[path]=false; if(path in pend) flush(path);
}
const saveProfilo=()=>{queue("app/profilo",S.profilo);reschedule()};
const saveDomande=()=>queue("app/domande",{items:S.domande});
const saveGiorno=k=>queue("giorni/"+k,{data:k,...S.giorni[k]});

/* ---------- utilità ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const keyOf=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>keyOf(new Date());
const parseK=k=>{const[a,b,c]=k.split("-").map(Number);return new Date(a,b-1,c)};
const GG=["dom","lun","mar","mer","gio","ven","sab"], MM=["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"];
const fmtK=k=>{const d=parseK(k);return GG[d.getDay()]+" "+d.getDate()+" "+MM[d.getMonth()]};
const giorno=k=>(S.giorni[k] ||= {checks:{},acqua:0,pasti:0,cammino:0,respiro:0,sint:{},flag:[],temp:"",peso:"",note:""});
const uid=()=>Math.random().toString(36).slice(2,9);
function toast(t){const el=document.createElement("div");el.className="toast";el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),2400)}
async function copy(t){try{await navigator.clipboard.writeText(t);toast("Copiato")}catch(e){toast("Tieni premuto sul testo per copiarlo")}}

/* ---------- notifiche native ---------- */
const LN=()=>window.Capacitor?.Plugins?.LocalNotifications;
const isNative=()=>!!window.Capacitor?.isNativePlatform?.();
let permOk=null, rsT=null;
async function ensurePerm(ask){
  const ln=LN(); if(!ln) return false;
  try{let p=await ln.checkPermissions(); if(p.display!=="granted"&&ask) p=await ln.requestPermissions(); permOk=p.display==="granted"; return permOk}catch(e){return false}
}
function reschedule(){clearTimeout(rsT);rsT=setTimeout(doSchedule,800)}
async function doSchedule(){
  const ln=LN(); if(!ln||!(await ensurePerm(false))) return;
  try{await ln.createChannel({id:"promemoria",name:"Promemoria",description:"Farmaci, acqua, respiro, diario e cure",importance:4,visibility:1,vibration:true})}catch(e){}
  try{const p=await ln.getPending(); if(p.notifications.length) await ln.cancel({notifications:p.notifications.map(n=>({id:n.id}))})}catch(e){}
  const P=S.profilo.prom, list=[]; let id=1;
  const base={channelId:"promemoria",smallIcon:"ic_stat_respiro",iconColor:"#23716C"};
  const daily=(t,title,body)=>{if(!t)return;const[h,m]=t.split(":").map(Number);if(isNaN(h)||isNaN(m))return;
    list.push({...base,id:id++,title,body,schedule:{on:{hour:h,minute:m},allowWhileIdle:true},extra:{tab:title.startsWith("Come stai")?"diario":"oggi"}})};
  if(P.farmaci) S.profilo.farmaci.forEach(f=>(f.orari||[]).forEach(o=>daily(o,"Farmaco: "+f.nome,f.nota||"Segnalo come preso nella schermata Oggi.")));
  if(P.acqua) ["10:00","12:00","15:00","17:00","19:00"].forEach(t=>daily(t,"Un bicchiere d'acqua","A piccoli sorsi. Segnalo nella schermata Oggi."));
  daily(P.respiro0,"Esercizio di respiro","3 minuti da seduta, con il braccio appoggiato.");
  daily(P.respiro1,"Esercizio di respiro","3 minuti da seduta, con il braccio appoggiato.");
  daily(P.cammino,"Una breve camminata","Anche 5 minuti vanno bene.");
  daily(P.diario,"Come stai oggi?","Un minuto per compilare il diario.");
  if(P.cure){const now=new Date();S.profilo.cicli.forEach(c=>{const d=parseK(c.data);
    const prima=new Date(d);prima.setDate(d.getDate()-1);prima.setHours(18,0,0,0);
    const matt=new Date(d);matt.setHours(7,30,0,0);
    if(prima>now) list.push({...base,id:id++,title:"Domani: "+c.tipo,body:fmtK(c.data)+(c.nota?" · "+c.nota:" · Prepara documenti e referti."),schedule:{at:prima,allowWhileIdle:true},extra:{tab:"cure"}});
    if(matt>now) list.push({...base,id:id++,title:"Oggi: "+c.tipo,body:c.nota||"Porta documenti e referti.",schedule:{at:matt,allowWhileIdle:true},extra:{tab:"cure"}});
  })}
  if(list.length){try{await ln.schedule({notifications:list.slice(0,200)})}catch(e){toast("Non sono riuscito a programmare i promemoria")}}
}
async function provaNotifica(){
  const ln=LN(); if(!ln){toast("Le notifiche funzionano nell'app installata");return}
  if(!(await ensurePerm(true))){toast("Notifiche non permesse: attivale nelle impostazioni del telefono");render();return}
  try{await ln.schedule({notifications:[{id:9999,title:"Forza Mamma❤️",body:"Le notifiche funzionano.",channelId:"promemoria",smallIcon:"ic_stat_respiro",iconColor:"#23716C",schedule:{at:new Date(Date.now()+5000),allowWhileIdle:true}}]});toast("Arriva tra 5 secondi")}catch(e){toast("Prova non riuscita")}
}
function promHTML(){
  const P=S.profilo.prom;
  const tog=(k,l,s)=>`<button class="check${P[k]?" on":""}" data-promchk="${k}" aria-pressed="${!!P[k]}"><span class="box">${P[k]?"✓":""}</span><span class="lab"><b>${l}</b><span class="sub">${s}</span></span></button>`;
  const tm=(k,l)=>`<label class="f grow">${l}<input type="time" data-promt="${k}" value="${esc(P[k]||"")}"></label>`;
  return `<section class="card"><h2>Promemoria sul telefono</h2>
    ${!isNative()?`<p class="note">Le notifiche funzionano nell'app installata sul telefono.</p>`:permOk===false?`<div class="alert">Le notifiche sono spente.<p>Tocca il pulsante qui sotto. Se non compare la richiesta, attivale in Impostazioni del telefono → App → Forza Mamma → Notifiche.</p></div>`:""}
    ${tog("farmaci","Farmaci","agli orari inseriti qui sopra")}
    ${tog("acqua","Acqua","5 volte al giorno, dalle 10 alle 19")}
    ${tog("cure","Chemio, esami e visite","il giorno prima alle 18 e la mattina alle 7:30")}
    <div class="row">${tm("respiro0","Respiro 1")}${tm("respiro1","Respiro 2")}</div>
    <div class="row">${tm("cammino","Camminata")}${tm("diario","Diario serale")}</div>
    <p class="small muted">Lascia vuoto un orario per non ricevere quel promemoria.</p>
    <button class="btn soft" id="provaN">${permOk===false?"Attiva le notifiche":"Prova una notifica"}</button></section>`;
}

/* ---------- navigazione ---------- */
let tab="oggi";
const TITOLI={oggi:"Oggi",respira:"Respiro",diario:"Diario",cure:"Cure",cucina:"Cucina",guide:"Guide"};
function apriMenu(on){
  $("#drawer").classList.toggle("open",on);$("#drawerBg").classList.toggle("open",on);
  $("#menuBtn").setAttribute("aria-expanded",on);document.body.style.overflow=on?"hidden":"";

}
$("#menuBtn").onclick=()=>apriMenu(true);
$("#drawerBg").onclick=()=>apriMenu(false);
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#drawer").classList.contains("open"))apriMenu(false)});
document.querySelectorAll("#drawer [data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;stopBreath();apriMenu(false);render();window.scrollTo({top:0})});
$("#drImpost").onclick=()=>{tab="cure";stopBreath();apriMenu(false);render();$("#impost").scrollIntoView()};
$("#drSos").onclick=()=>{apriMenu(false);$("#sosBtn").click()};
const ALLARMI=[
 ["Febbre a 38 °C o più, oppure brividi","Durante la chemio le difese possono essere basse: chiama subito il centro, anche di notte o nel fine settimana."],
 ["Fiato corto nuovo o che peggiora all'improvviso",""],
 ["Dolore al petto o battito del cuore molto accelerato",""],
 ["Sangue nella tosse o nell'espettorato",""],
 ["Vomito o diarrea che non ti lasciano bere o durano più di un giorno",""],
 ["Lividi o sanguinamenti insoliti (gengive, naso, urine)",""],
 ["Dolore nuovo o forte, confusione, gonfiore di viso, collo o braccio",""],
 ["Qualsiasi sintomo nuovo che ti preoccupa","Lo specialista preferisce essere avvisato: potrà intervenire o rassicurarti."]];
$("#sosBtn").onclick=()=>openSheet(`
  <h2>Chiama subito se…</h2>
  <div class="list">${ALLARMI.map(([t,s])=>`<div class="li" style="align-items:flex-start"><div class="grow"><b>${t}</b>${s?`<p class="small muted">${s}</p>`:""}</div></div>`).join("")}</div>
  <div class="alert">Emergenza grave (non respiri, svenimento, dolore al petto forte):<a class="btn alarm" href="tel:112">${PHONE_ICON}Chiama il 112</a></div>
  <h3>I tuoi numeri</h3>
  <div class="list">${contattiHTML(true)}</div>
  <button class="btn" data-close>Chiudi</button>`);

function openSheet(html){
  const bg=document.createElement("div");bg.className="sheet-bg";bg.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  bg.onclick=e=>{if(e.target===bg||e.target.closest("[data-close]"))bg.remove();
    const c=e.target.closest("[data-copy]");if(c)copy(c.dataset.copy)};
  document.body.appendChild(bg);bg.querySelector("button")?.focus();return bg;
}
// Numero pulito per il link tel: (solo cifre, + iniziale se c'è).
const telNum=t=>{const v=String(t??"").trim();return (v.startsWith("+")?"+":"")+v.replace(/\D/g,"")};
const PHONE_ICON='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2Z"/></svg>';
function chiamaHTML(tel,label="Chiama"){return `<a class="btn sm primary" href="tel:${esc(telNum(tel))}">${PHONE_ICON}${label}</a>`}
function contattiHTML(onlyFilled){
  const cs=S.profilo.contatti.filter(c=>!onlyFilled||c.tel);
  if(!cs.length) return `<p class="muted">Nessun numero inserito. Aggiungili in <b>Cure → Contatti</b>.</p>`;
  return cs.map(c=>`<div class="li"><div class="grow"><span class="small muted">${esc(c.ruolo)}</span><br><b>${esc(c.nome)}</b> <span class="tel">${esc(c.tel)}</span></div>${c.tel?`<div class="calls">${chiamaHTML(c.tel)}<button class="btn sm soft" data-copy="${esc(c.tel)}">Copia</button></div>`:""}</div>`).join("");
}

/* ---------- OGGI ---------- */
const isChemio=c=>!c.tipo||c.tipo==="Chemioterapia";
function prossimoCiclo(){
  const t=today();const fut=S.profilo.cicli.filter(c=>c.data>=t).sort((a,b)=>a.data<b.data?-1:1);return fut[0];
}
function giorniA(k){return Math.round((parseK(k)-parseK(today()))/864e5)}
function renderOggi(){
  const k=today(), g=giorno(k), p=S.profilo, h=new Date().getHours();
  const saluto=h<12?"Buongiorno":h<18?"Buon pomeriggio":"Buonasera";
  const nc=prossimoCiclo();
  const gg=nc?giorniA(nc.data):0, nome=nc&&isChemio(nc)?"Chemio":esc(nc?.tipo);
  const chip=nc?`<span class="chemo-chip">${gg===0?nome+" oggi":gg===1?nome+" domani":(isChemio(nc)?"Prossima chemio":nome)+" tra "+gg+" giorni"} · ${fmtK(nc.data)}</span>`:"";
  const farm=p.farmaci.flatMap(f=>(f.orari||[""]).map(o=>({id:f.id+"@"+o,nome:f.nome,ora:o,nota:f.nota}))).sort((a,b)=>(a.ora||"99")<(b.ora||"99")?-1:1);
  const fatto=[...farm.map(f=>g.checks[f.id]),g.acqua>=p.obAcqua,g.pasti>=p.obPasti,g.respiro>=2,g.cammino>=p.obCammino,g.checks.bocca_m&&g.checks.bocca_s,!!g.sint.compilato].filter(Boolean).length;
  const tot=farm.length+6;
  const tempAlarm=Number(String(g.temp).replace(",","."))>=38;
  return `
  <section class="hero">
    <span class="eyebrow">${fmtK(k)}</span>
    <h1>${saluto}${p.nome?", "+esc(p.nome):""}</h1>
    ${chip}
    <p class="muted">${fatto} di ${tot} cose fatte oggi. Anche poco va bene.</p>
  </section>
  ${tempAlarm?`<div class="alert">Hai segnato ${esc(g.temp)} °C di febbre. Chiama subito il centro oncologico.<p>${contattiHTML(true).includes("tel")?"I numeri sono nel pulsante rosso in alto.":"Aggiungi il numero del centro in Cure → Contatti."}</p></div>`:""}

  <section class="card">
    <div class="row between"><h2>Farmaci</h2><button class="btn sm ghost" data-go="cure">Modifica</button></div>
    ${farm.length?farm.map(f=>checkHTML(f.id,f.nome,(f.ora?f.ora+" · ":"")+(f.nota||""),g.checks[f.id])).join(""):
      `<p class="muted">Inserisci i farmaci con orari e dosi esattamente come scritti dal medico, in <b>Cure → Farmaci</b>. Qui compariranno da spuntare.</p>`}
  </section>

  <section class="card">
    <h2>Corpo</h2>
    ${counterHTML("acqua","Acqua","bicchieri da 250 ml, obiettivo "+p.obAcqua+" (circa 1,5 litri)",g.acqua,p.obAcqua,true)}
    ${counterHTML("pasti","Pasti e spuntini","piccoli e frequenti, obiettivo "+p.obPasti,g.pasti,p.obPasti)}
    <button class="btn sm soft" data-go="cucina">Idee per i pasti di oggi</button>
    ${counterHTML("respiro","Esercizi di respiro","obiettivo 2 sessioni",g.respiro,2)}
    ${counterHTML("cammino","Camminata","minuti, obiettivo "+p.obCammino,g.cammino,p.obCammino,false,5)}
    ${checkHTML("bocca_m","Igiene della bocca, mattina","spazzolino morbido e sciacquo",g.checks.bocca_m)}
    ${checkHTML("bocca_s","Igiene della bocca, sera","spazzolino morbido e sciacquo",g.checks.bocca_s)}
  </section>

  <section class="card">
    <div class="row between"><h2>Come stai oggi?</h2>${g.sint.compilato?`<span class="small" style="color:var(--ok);font-weight:700">Compilato</span>`:""}</div>
    <p class="muted">Un minuto per segnare stanchezza, nausea, dolore e temperatura. Ti aiuta a raccontarlo bene alla visita.</p>
    <button class="btn primary" data-go="diario">${g.sint.compilato?"Rivedi il diario di oggi":"Compila il diario"}</button>
  </section>

  <section class="note"><b>Spalla rotta:</b> niente pesi e niente appoggio sul braccio. Gli esercizi per la spalla solo quelli dati dal fisioterapista o dall'ortopedico (li trovi in <b>Respiro → Movimento</b>).</section>
  `;
}
function checkHTML(id,lab,sub,on){return `<button class="check${on?" on":""}" data-check="${esc(id)}" aria-pressed="${!!on}"><span class="box">${on?"✓":""}</span><span class="lab"><b>${esc(lab)}</b>${sub?`<span class="sub">${esc(sub)}</span>`:""}</span></button>`}
function counterHTML(f,lab,sub,n,ob,drops,step){
  return `<div class="counter"><div class="lab"><b>${lab}</b><span class="small muted" style="display:block">${sub}</span>
   ${drops?`<div class="drops">${Array.from({length:ob},(_,i)=>`<i class="${i<n?"on":""}"></i>`).join("")}</div>`:""}</div>
   <button class="round" data-cnt="${f}" data-d="-${step||1}" aria-label="Togli">−</button><span class="n" aria-live="polite">${n}</span>
   <button class="round plus" data-cnt="${f}" data-d="${step||1}" aria-label="Aggiungi">+</button></div>`;
}

/* ---------- RESPIRO e MOVIMENTO ---------- */
const MODI={
  diaf:{nome:"Diaframmatica",fasi:[["Inspira dal naso",4,1.9],["Espira lenta",6,1]],
    come:["Seduta comoda, schiena appoggiata, braccio della spalla rotta sostenuto da un cuscino.","Mano sana sulla pancia: inspirando dal naso la pancia si gonfia, il petto resta fermo.","Espira piano dalla bocca, più a lungo di quanto hai inspirato."]},
  labbra:{nome:"Labbra socchiuse",fasi:[["Inspira dal naso",2,1.7],["Soffia piano",4,1]],

    come:["Per l'ansia, prima di una visita o per addormentarti.","Non forzare la pausa: se ti dà fastidio, saltala."]}};
let modo="diaf", durata=3, bTimer=null, bEnd=0, sub="respiro", walk={on:false,start:0,acc:0,t:null};
function renderRespira(){
  return `
  <section class="hero"><span class="eyebrow">Respiro e movimento</span><h1>${sub==="respiro"?"Respira con calma":"Muoversi un po'"}</h1></section>

function respiroHTML(){

  <p class="small muted">Se ti gira la testa fermati e respira normalmente. Chiedi in ospedale se è possibile fare riabilitazione respiratoria.</p></section>`;
}
function movimentoHTML(){
  const g=giorno(today()), p=S.profilo;
  const sec=walk.on?Math.floor((Date.now()-walk.start)/1000)+walk.acc:walk.acc;
  return `

function checkMini(id,on){return `<button class="round${on?" plus":""}" data-check="${id}" aria-pressed="${!!on}" aria-label="Fatto">${on?"✓":""}</button>`}

function startBreath(){
  const m=MODI[modo];bEnd=Date.now()+durata*60000;let i=0;
  const orb=$("#orb"),cue=$("#cue");
  const step=()=>{
    if(Date.now()>=bEnd){finishBreath();return}
    const [t,sec,sc]=m.fasi[i%m.fasi.length];i++;
    if(cue)cue.textContent=t; if(orb){orb.style.transitionDuration=sec+"s";orb.style.transform=`scale(${sc})`}
    bTimer=setTimeout(step,sec*1000);
  };
  const clock=setInterval(()=>{const r=Math.max(0,bEnd-Date.now());const el=$("#bclock");if(el)el.textContent=Math.floor(r/60000)+":"+pad(Math.floor(r/1000)%60);if(!bTimer)clearInterval(clock)},250);
  step(); $("#bgo").textContent="Ferma";
}
function stopBreath(){clearTimeout(bTimer);bTimer=null}
function finishBreath(){stopBreath();const k=today();giorno(k).respiro++;saveGiorno(k);toast("Fatto. Sessione segnata in Oggi");render()}

function ultimi(n){const out=[];const d=new Date();for(let i=n-1;i>=0;i--){const x=new Date(d);x.setDate(d.getDate()-i);out.push(keyOf(x))}return out}
function storicoHTML(){
  const ks=ultimi(14), vals=ks.map(k=>S.giorni[k]?.sint?.compilato?S.giorni[k].sint.stanch:null);

  const W=320,H=90,px=i=>8+i*(W-16)/13,py=v=>H-12-v*(H-24)/10;
  let path="",dots="";vals.forEach((v,i)=>{if(v==null)return;path+=(path?"L":"M")+px(i).toFixed(1)+" "+py(v).toFixed(1);dots+=`<circle cx="${px(i)}" cy="${py(v)}" r="3.5" fill="var(--accent)"/>`});

function riepilogo(){

  }).join("\n")+(S.domande.filter(d=>!d.fatta).length?"\n\nDomande per l'oncologo:\n"+S.domande.filter(d=>!d.fatta).map(d=>"• "+d.testo).join("\n"):"");

function agendaHTML(list,conOggi){
  const t=today(),giorni=new Map();
  if(conOggi) giorni.set(t,[]);
  list.forEach(c=>{if(!giorni.has(c.data))giorni.set(c.data,[]);giorni.get(c.data).push(c)});
  let mese="",out="";
  for(const [k,evs] of giorni){
    const d=parseK(k),m=d.getFullYear()+"-"+d.getMonth();
    if(m!==mese){mese=m;out+=`<div class="cal-m">${MESI[d.getMonth()]}${d.getFullYear()!==new Date().getFullYear()?" "+d.getFullYear():""}</div>`}
    out+=`<div class="cal-day${k===t?" today":""}"><div class="cal-date"${k===t?' aria-label="oggi"':""}><span>${GG[d.getDay()]}</span><b>${d.getDate()}</b></div><div class="cal-evs">${

      :`<div class="cal-empty">Oggi niente in programma</div>`}</div></div>`;
  }
  return out;
}

const BK="ANNA-BACKUP-1";
function backupTesto(){const {ultimoBackup,...dati}=S;return BK+"\n"+JSON.stringify({creato:new Date().toISOString(),...dati})}
function apriBackup(){
  const txt=backupTesto();
  const bg=openSheet(`<h2>Copia il backup</h2><p class="muted">Tocca "Copia", poi incolla il testo in un messaggio a te stesso. Per ripristinare servirà tutto il testo, dall'inizio alla fine.</p>

    <div class="row"><button class="btn primary grow" id="bkCp">Copia</button><button class="btn grow" data-close>Chiudi</button></div>`);
  bg.querySelector("#bkCp").onclick=async()=>{await copy(txt);S.ultimoBackup=today();saveLocal();render()};
}
function apriRipristino(){
  const bg=openSheet(`<h2>Ripristina un backup</h2><p class="muted">Incolla qui tutto il testo del backup. <b>I dati attuali di questo telefono verranno sostituiti.</b></p>
    <textarea id="bkIn" style="min-height:140px;font-size:.8rem" placeholder="ANNA-BACKUP-1 …"></textarea><div id="bkErr"></div>
    <div class="row"><button class="btn primary grow" id="bkDo">Ripristina</button><button class="btn grow" data-close>Annulla</button></div>`);
  bg.querySelector("#bkDo").onclick=()=>{
    const err=m=>{bg.querySelector("#bkErr").innerHTML=`<div class="alert">${m}</div>`};
    let o;try{const t=bg.querySelector("#bkIn").value.trim();if(!t.startsWith(BK))throw 0;o=JSON.parse(t.slice(BK.length))}catch(e){err("Il testo non è un backup valido: controlla di averlo incollato tutto.");return}
    if(typeof o!=="object"||!o.profilo||typeof o.giorni!=="object"){err("Il backup è incompleto.");return}
    S={profilo:{...structuredClone(DEF_PROFILO),...o.profilo,prom:{...DEF_PROFILO.prom,...(o.profilo.prom||{})}},giorni:o.giorni||{},domande:Array.isArray(o.domande)?o.domande:[],ultimoBackup:S.ultimoBackup};
    saveLocal();reschedule();bg.remove();toast("Dati ripristinati");render();
  };
}

 {id:"scaloppine",nome:"Scaloppine di pollo al limone",per:["gusto","appetito"],tempo:"20 min",porz:"2 porzioni",mano:false,
  perche:"Il limone aiuta a coprire il sapore metallico che a volte lascia la chemio.",
  ingr:["300 g di petto di pollo a fette sottili","farina per infarinare","1 limone grande (succo e un po' di scorza)","2 cucchiai di olio extravergine","per la salsina: 20 g di burro, 20 g di farina, 100 ml di brodo vegetale caldo","prezzemolo tritato","sale e pepe"],
  passi:["Infarina le fettine di pollo da entrambi i lati.","Scalda l'olio in padella e cuoci le fettine a fuoco medio 4–5 minuti, con sale e pepe.","Girale, versa metà del succo di limone e cuoci altri 4 minuti. Toglile e tienile al caldo.","Nella stessa padella sciogli il burro, aggiungi la farina e mescola.","Versa il resto del succo di limone e il brodo caldo, mescolando, e fai addensare 1 minuto.","Aggiungi prezzemolo e scorza di limone, rimetti il pollo nella salsina e servi."],

  video:{url:YT+"RvV5i2ixfmo",fonte:"YouTube · GialloZafferano · 1 min",nota:"nel video le dosi sono per 4"}},
];
const REGOLE=["Carne, pesce e uova sempre ben cotti: niente crudi, carpaccio, sushi, uova crude (tiramisù, maionese fatta in casa).",
 "Latte, yogurt e formaggi solo pastorizzati; niente formaggi a latte crudo.",
 "Frutta e verdura lavate bene sotto l'acqua corrente; se le difese sono basse chiedi se è meglio mangiarle cotte o sbucciate.",
 "Lavati le mani prima di cucinare e dopo aver toccato carne o pesce crudi; taglieri separati.",
 "Avanzi in frigo subito, coperti, da mangiare entro 1–2 giorni e ben riscaldati.",
 "Pompelmo, iperico, tisane e integratori \"naturali\" possono interferire con alcuni farmaci: chiedi all'oncologo prima di usarli."];
let cucinaF=null;
// Disturbi segnati oggi nel diario, per proporre subito le ricette adatte.
function disturbiOggi(){
  const g=giorno(today()),out=new Set(),fl=g.flag||[];
  if(fl.includes("Vomito")) out.add("nausea");
  if(fl.includes("Diarrea")) out.add("diarrea");
  if(fl.includes("Stitichezza")) out.add("stitichezza");
  if(fl.includes("Bocca dolorante")) out.add("bocca");
  if(fl.includes("Gusto alterato")) out.add("gusto");
  if(g.sint.compilato&&(g.sint.nausea??0)>=4) out.add("nausea");
  if(g.sint.compilato&&(g.sint.appet??0)>=4) out.add("appetito");
  return [...out];
}
function renderCucina(){
  const oggi=disturbiOggi();
  const f=cucinaF??(oggi[0]||"tutte");
  const lista=f==="tutte"?RICETTE:RICETTE.filter(r=>r.per.includes(f));
  return `
  <section class="hero"><span class="eyebrow">Ricette semplici</span><h1>Cucina</h1>
    <p class="muted">Piatti facili, passo passo e con il video. Durante la chemio l'importante è mangiare abbastanza, soprattutto proteine: non serve mangiare "leggero".</p></section>
  ${oggi.length&&cucinaF==null?`<p class="note">Nel diario di oggi hai segnato: <b>${oggi.map(d=>NOME_DIST[d]).join(", ")}</b>. Ti mostro le ricette adatte.</p>`:""}
  <section class="card"><h3>Ricette adatte se hai…</h3>
    <div class="pills">${[["tutte","Tutte"],...DISTURBI].map(([k,l])=>`<button class="pill${f===k?" on":""}" data-cf="${k}" aria-pressed="${f===k}">${l}</button>`).join("")}</div></section>
  <div class="plain">${lista.map(r=>`<button class="rc" data-ric="${r.id}"><b>${esc(r.nome)}</b>
    <span class="small muted">${esc(r.tempo)} · ${esc(r.porz)}${r.mano?" · si fa anche con una mano":""}</span>
    <span class="tags">${r.per.map(d=>`<span class="tag${d===f?"":" w"}">${NOME_DIST[d]}</span>`).join("")}</span></button>`).join("")||`<p class="muted">Nessuna ricetta per questo filtro.</p>`}</div>
  <details class="g"><summary>Regole d'oro in cucina durante la chemio</summary><div class="body"><ul>${REGOLE.map(l=>`<li>${esc(l)}</li>`).join("")}</ul>
    <a class="src" href="${AIMAC}/libretti-tumore/nutrizione-malato-cancro" target="_blank" rel="noopener">La nutrizione nel malato oncologico (AIMaC)</a></div></details>
  <p class="src">Ricette e consigli generali. Se il nutrizionista o l'oncologo ti hanno dato indicazioni diverse, valgono le loro. I video sono di siti di cucina esterni: segui le dosi e i consigli scritti qui.</p>`;
}
function ricettaHTML(r){
  return `<div class="row between"><h2 class="grow">${esc(r.nome)}</h2><button class="x" data-close aria-label="Chiudi">✕</button></div>
  <p class="small muted">${esc(r.tempo)} · ${esc(r.porz)}${r.mano?" · si fa anche con una mano":""}</p>
  <div class="tags">${r.per.map(d=>`<span class="tag">${NOME_DIST[d]}</span>`).join("")}</div>
  <p>${esc(r.perche)}</p>
  <a class="btn primary vid" href="${r.video.url}" target="_blank" rel="noopener"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>Guarda il video</a>
  <p class="src" style="margin-top:-6px">${esc(r.video.fonte)}${r.video.nota?" · "+esc(r.video.nota):""}</p>
  <button class="btn soft" data-step="0">Cucina passo passo</button>
  <h3>Ingredienti</h3><ul class="ingr">${r.ingr.map(i=>`<li>${esc(i)}</li>`).join("")}</ul>
  <h3>Come si fa</h3><ol class="steps">${r.passi.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>
  <div class="note"><b>Informazioni utili</b><ul class="ingr" style="margin-top:6px">${r.info.map(i=>`<li>${esc(i)}</li>`).join("")}</ul></div>
  <button class="btn" data-close>Chiudi</button>`;
}
function passoHTML(r,i){
  const n=r.passi.length;
  return `<div class="row between"><span class="eyebrow">${esc(r.nome)}</span><button class="x" data-close aria-label="Chiudi">✕</button></div>
  <h2>Passo ${i+1} di ${n}</h2>
  <p class="step-big">${esc(r.passi[i])}</p>
  <div class="row"><button class="btn grow" data-step="${i-1}" ${i===0?"disabled":""}>Indietro</button>
    ${i<n-1?`<button class="btn primary grow" data-step="${i+1}">Avanti</button>`:`<button class="btn primary grow" data-step="fine">Fatto!</button>`}</div>
  <button class="btn ghost" data-step="ricetta">Torna alla ricetta</button>`;
}
function openRicetta(id){
  const r=RICETTE.find(x=>x.id===id);if(!r)return;
  const bg=openSheet(ricettaHTML(r)),sh=bg.querySelector(".sheet");
  sh.addEventListener("click",e=>{
    const b=e.target.closest("[data-step]");if(!b)return;
    const v=b.dataset.step;
    if(v==="fine"){bg.remove();toast("Buon appetito!");return}
    sh.innerHTML=v==="ricetta"?ricettaHTML(r):passoHTML(r,Number(v));
    sh.scrollTop=0;sh.querySelector("button:not([disabled])")?.focus();
  });
}

/* ---------- render ed eventi ---------- */
function render(){
  document.querySelectorAll("#drawer [data-tab]").forEach(b=>{b.classList.toggle("on",b.dataset.tab===tab);b.dataset.tab===tab?b.setAttribute("aria-current","page"):b.removeAttribute("aria-current")});
  $("#barTitle").textContent=TITOLI[tab];$("#drNome").textContent=S.profilo.nome||"Il diario delle cure";
  $("#view").innerHTML=`<div class="wrap" style="padding:0">${({oggi:renderOggi,respira:renderRespira,diario:renderDiario,cure:renderCure,cucina:renderCucina,guide:renderGuide})[tab]()}</div>`;
  bind();
}
function bind(){
  const k=today();
  const V=$("#view");
  V.onclick=e=>{
    const t=e.target.closest("button,[data-copy]");if(!t)return;
    if(t.dataset.go){tab=t.dataset.go;render();scrollTo({top:0});return}
    if(t.dataset.copy){copy(t.dataset.copy);return}
    if(t.dataset.check){const g=giorno(k);g.checks[t.dataset.check]=!g.checks[t.dataset.check];saveGiorno(k);render();return}
    if(t.dataset.cnt){const g=giorno(k),f=t.dataset.cnt;g[f]=Math.max(0,(g[f]||0)+Number(t.dataset.d));saveGiorno(k);render();return}
    if(t.dataset.sub){sub=t.dataset.sub;stopBreath();render();return}
    if(t.dataset.modo){modo=t.dataset.modo;stopBreath();render();return}
    if(t.dataset.dur){durata=Number(t.dataset.dur);stopBreath();render();return}
    if(t.id==="bgo"){if(bTimer){stopBreath();render()}else startBreath();return}
    if(t.id==="wgo"){if(walk.on){walk.acc+=Math.floor((Date.now()-walk.start)/1000);walk.on=false;clearInterval(walk.t)}else{walk.on=true;walk.start=Date.now();walk.t=setInterval(()=>{const el=$("#wclock");if(!el)return;const s=Math.floor((Date.now()-walk.start)/1000)+walk.acc;el.textContent=pad(Math.floor(s/60))+":"+pad(s%60)},500)}render();return}
    if(t.id==="wsave"){const s=walk.acc+(walk.on?Math.floor((Date.now()-walk.start)/1000):0);clearInterval(walk.t);walk={on:false,start:0,acc:0,t:null};giorno(k).cammino+=Math.max(1,Math.round(s/60));saveGiorno(k);toast("Camminata salvata");render();return}
    if(t.dataset.delsp){S.profilo.esSpalla=S.profilo.esSpalla.filter(x=>x.id!==t.dataset.delsp);saveProfilo();render();return}
    if(t.dataset.delc){S.profilo.cicli=S.profilo.cicli.filter(x=>x.id!==t.dataset.delc);saveProfilo();render();return}
    if(t.dataset.delf){S.profilo.farmaci=S.profilo.farmaci.filter(x=>x.id!==t.dataset.delf);saveProfilo();render();return}
    if(t.dataset.dom){const d=S.domande.find(x=>x.id===t.dataset.dom);d.fatta=!d.fatta;saveDomande();render();return}
    if(t.dataset.deld){S.domande=S.domande.filter(x=>x.id!==t.dataset.deld);saveDomande();render();return}
    if(t.dataset.flag){const g=giorno(k),f=t.dataset.flag;g.flag=g.flag.includes(f)?g.flag.filter(x=>x!==f):[...g.flag,f];saveGiorno(k);render();return}
    if(t.id==="addIdee"){V.querySelectorAll("details.g li").forEach(li=>{if(!S.domande.some(d=>d.testo===li.textContent))S.domande.push({id:uid(),testo:li.textContent,fatta:false})});saveDomande();toast("Domande aggiunte");render();return}
    if(t.id==="dSave"){const g=giorno(k);g.sint.compilato=true;g.temp=$("#dTemp").value;g.peso=$("#dPeso").value;g.note=$("#dNote").value;saveGiorno(k);toast("Diario salvato");
      if(Number(String(g.temp).replace(",","."))>=38){tab="oggi"}render();scrollTo({top:0});return}
    if(t.dataset.promchk){const k2=t.dataset.promchk;S.profilo.prom[k2]=!S.profilo.prom[k2];saveProfilo();render();return}
    if(t.id==="provaN"){provaNotifica();return}
    if(t.id==="bkCopia"){apriBackup();return}
    if(t.id==="cAdd"){apriNuovaData();return}
    if(t.id==="bkRipr"){apriRipristino();return}
    if(t.dataset.cf!=null){cucinaF=t.dataset.cf;render();return}
    if(t.dataset.ric){openRicetta(t.dataset.ric);return}
    if(t.id==="riep"){const txt=riepilogo();openSheet(`<h2>Riepilogo per la visita</h2><pre style="white-space:pre-wrap;font-family:var(--f-body);margin:0;background:var(--sunk);padding:14px;border-radius:12px;user-select:all">${esc(txt)}</pre><div class="row"><button class="btn primary grow" data-copy="${esc(txt)}">Copia il testo</button><button class="btn grow" data-close>Chiudi</button></div>`);return}
  };
  V.oninput=e=>{
    const t=e.target;
    if(t.dataset.sint){const g=giorno(k);g.sint[t.dataset.sint]=Number(t.value);$("#o_"+t.dataset.sint).textContent=t.value;saveGiorno(k)}
    if(t.id==="dTemp"){const v=Number(t.value.replace(",","."));$("#tempWarn").innerHTML=v>=38?`<div class="alert">38 °C o più: chiama subito il centro oncologico, non aspettare la visita.</div>`:""}
    if(t.dataset.cn!=null){S.profilo.contatti[t.dataset.cn].nome=t.value;saveProfilo()}
    if(t.dataset.ct!=null){S.profilo.contatti[t.dataset.ct].tel=t.value;saveProfilo()}
    if(t.dataset.promt){S.profilo.prom[t.dataset.promt]=t.value;saveProfilo()}
    if(t.id==="pNome"){S.profilo.nome=t.value;saveProfilo()}
    if(t.id==="pAcqua"&&t.value){S.profilo.obAcqua=Math.max(1,Number(t.value));saveProfilo()}
    if(t.id==="pPasti"&&t.value){S.profilo.obPasti=Math.max(1,Number(t.value));saveProfilo()}
    if(t.id==="pCam"&&t.value!==""){S.profilo.obCammino=Math.max(0,Number(t.value));saveProfilo()}
  };
  V.onsubmit=e=>{
    e.preventDefault();const f=e.target;
    if(f.id==="spForm"){S.profilo.esSpalla.push({id:uid(),nome:$("#spNome").value.trim(),dettagli:$("#spDet").value.trim()});saveProfilo()}
    if(f.id==="fForm"){S.profilo.farmaci.push({id:uid(),nome:$("#fNome").value.trim(),orari:[$("#fO1").value,$("#fO2").value,$("#fO3").value].filter(Boolean),nota:$("#fNota").value.trim()});saveProfilo()}
    if(f.id==="dForm"){S.domande.push({id:uid(),testo:$("#dTesto").value.trim(),fatta:false});saveDomande()}
    toast("Aggiunto");render();
  };
}
render();
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&!document.querySelector(".sheet-bg"))render()});
(async()=>{
  if(!isNative()) return;
  await ensurePerm(true); await doSchedule();
  try{LN().addListener("localNotificationActionPerformed",a=>{const tb=a?.notification?.extra?.tab;if(tb){tab=tb;render();scrollTo({top:0})}})}catch(e){}
  if(tab==="cure") render();
})();
setInterval(()=>{if(tab==="oggi"&&!document.querySelector(".sheet-bg")&&document.activeElement===document.body)render()},60000);

})();
</script>
